<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Teacher's Day, Ma'am Clarice! 💗</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: "Poppins", Arial, sans-serif;
        background: linear-gradient(135deg, #ffd6e7, #fff0f6, #dff6ff);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        color: #5a4050;
    }

    /* Floating flowers */
    .flower {
        position: fixed;
        font-size: 30px;
        animation: float 6s ease-in-out infinite;
        opacity: 0.8;
        pointer-events: none;
    }

    .flower:nth-child(1) {
        top: 10%;
        left: 8%;
        animation-delay: 0s;
    }

    .flower:nth-child(2) {
        top: 20%;
        right: 10%;
        animation-delay: 1s;
    }

    .flower:nth-child(3) {
        bottom: 15%;
        left: 12%;
        animation-delay: 2s;
    }

    .flower:nth-child(4) {
        bottom: 10%;
        right: 8%;
        animation-delay: 3s;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0) rotate(0deg);
        }

        50% {
            transform: translateY(-20px) rotate(10deg);
        }
    }

    .container {
        width: 90%;
        max-width: 800px;
        text-align: center;
        padding: 30px 20px;
        z-index: 2;
    }

    .title {
        font-size: clamp(35px, 8vw, 65px);
        color: #d95f91;
        font-weight: 800;
        margin-bottom: 10px;
        text-shadow: 2px 3px rgba(255,255,255,0.8);
    }

    .subtitle {
        font-size: 18px;
        margin-bottom: 35px;
        color: #765568;
    }

    /* Envelope */
    .envelope-container {
        position: relative;
        width: 300px;
        height: 210px;
        margin: 30px auto;
        cursor: pointer;
        perspective: 1000px;
    }

    .envelope {
        position: relative;
        width: 100%;
        height: 100%;
        background: #f6a9c5;
        border-radius: 10px;
        box-shadow: 0 15px 35px rgba(120, 60, 90, 0.25);
        overflow: hidden;
    }

    .envelope::before {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        border-left: 150px solid transparent;
        border-right: 150px solid transparent;
        border-bottom: 105px solid #ed91b3;
        z-index: 2;
    }

    .envelope::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        border-left: 150px solid transparent;
        border-right: 150px solid transparent;
        border-top: 110px solid #f9bdd3;
        transform-origin: top;
        transition: transform 0.8s ease;
        z-index: 4;
    }

    .heart {
        position: absolute;
        z-index: 5;
        top: 82px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 42px;
        transition: 0.5s;
    }

    .open-button {
        border: none;
        padding: 15px 28px;
        border-radius: 30px;
        background: #d95f91;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 7px 15px rgba(217,95,145,0.3);
        transition: 0.3s;
        margin-top: 20px;
    }

    .open-button:hover {
        transform: translateY(-3px) scale(1.03);
        background: #c94f82;
    }

    /* Letter */
    .letter {
        display: none;
        background: #fffdf9;
        width: 100%;
        max-width: 700px;
        margin: 40px auto 0;
        padding: 45px;
        border-radius: 15px;
        box-shadow: 0 15px 45px rgba(100,60,80,0.2);
        text-align: left;
        position: relative;
        animation: letterAppear 1s ease forwards;
    }

    @keyframes letterAppear {
        from {
            opacity: 0;
            transform: translateY(40px) scale(0.95);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .letter::before {
        content: "💐";
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 30px;
    }

    .letter h2 {
        color: #d95f91;
        margin-bottom: 25px;
        font-size: 28px;
    }

    .letter p {
        font-family: Georgia, serif;
        font-size: 18px;
        line-height: 1.8;
        margin-bottom: 20px;
    }

    .signature {
        margin-top: 30px;
        text-align: right;
        font-family: Georgia, serif;
        font-style: italic;
        font-size: 18px;
        color: #d95f91;
    }

    /* Confetti */
    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -20px;
        z-index: 10;
        animation: fall 4s linear forwards;
        pointer-events: none;
    }

    @keyframes fall {
        0% {
            transform: translateY(-20px) rotate(0deg);
            opacity: 1;
        }

        100% {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }

    /* Mobile */
    @media (max-width: 600px) {

        .container {
            padding: 25px 10px;
        }

        .subtitle {
            font-size: 15px;
        }

        .envelope-container {
            width: 270px;
            height: 190px;
        }

        .envelope::before {
            border-left-width: 135px;
            border-right-width: 135px;
            border-bottom-width: 95px;
        }

        .envelope::after {
            border-left-width: 135px;
            border-right-width: 135px;
            border-top-width: 100px;
        }

        .letter {
            padding: 30px 22px;
        }

        .letter p {
            font-size: 16px;
            line-height: 1.7;
        }

        .letter h2 {
            font-size: 24px;
        }
    }
</style>
</head>

<body>

<!-- Floating decorations -->
<div class="flower">🌸</div>
<div class="flower">🌷</div>
<div class="flower">🌼</div>
<div class="flower">🌸</div>

<div class="container">

    <h1 class="title">Happy Teacher's Day! 💗</h1>

    <p class="subtitle">
        A little surprise for our wonderful teacher, Ma'am Clarice 🌷
    </p>

    <!-- Envelope -->
    <div class="envelope-container" onclick="openCard()">

        <div class="envelope">

            <div class="heart">💌</div>

        </div>

    </div>

    <button class="open-button" onclick="openCard()">
        💌 Open Your Surprise
    </button>


    <!-- Letter -->
    <div class="letter" id="letter">

        <h2>Dear Ma'am Clarice,</h2>

        <div id="message"></div>

<div class="signature">
    With love,<br>
    Shils &lt;3 💗
</div>

    </div>

</div>


<script>

const letterText = `
Happy Teacher's Day! 💐

Thank you for not only being our teacher, but also our second parent, friend, and number one supporter. Thank you for your endless patience with us, for guiding us, and for shaping not only our minds but also our hearts.

We feel truly blessed and grateful to have you as our teacher this school year. Thank you for inspiring us, motivating us, and being someone we all look up to.

We hope you enjoyed our little surprise for you! We appreciate you not just today on Teacher's Day, but every day and forever. <3
`;

let opened = false;

function openCard() {

    if (opened) return;

    opened = true;

    const letter = document.getElementById("letter");
    const envelope = document.querySelector(".envelope");

    /* Open envelope */
    envelope.classList.add("opened");

    /* Show letter */
    setTimeout(() => {

        letter.style.display = "block";

        typeMessage();

        createConfetti();

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

    }, 700);
}


/* Typing effect */
function typeMessage() {

    const message = document.getElementById("message");

    message.innerHTML = "";

    let index = 0;

    function type() {

        if (index < letterText.length) {

            const character = letterText[index];

            if (character === "\n") {
                message.innerHTML += "<br>";
            } else {
                message.innerHTML += character;
            }

            index++;

            setTimeout(type, 20);

        }
    }

    type();
}


/* Confetti */
function createConfetti() {

    const symbols = ["💗", "🌸", "🌷", "✨", "💐", "💕"];

    for (let i = 0; i < 70; i++) {

        const confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.innerHTML =
            symbols[Math.floor(Math.random() * symbols.length)];

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.fontSize =
            (Math.random() * 15 + 10) + "px";

        confetti.style.animationDuration =
            (Math.random() * 2 + 3) + "s";

        confetti.style.animationDelay =
            Math.random() * 2 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 6000);
    }
}

</script>

</body>
</html>
